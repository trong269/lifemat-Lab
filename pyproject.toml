[project]
name = "lifemate-lab"
version = "0.1.0"
description = "LifeMate (ZAC 2026) — agent_core + development platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "httpx>=0.27",
    "openai>=1.60",
    "anthropic>=0.75",
    "numpy>=1.26",
    "scipy>=1.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lab = "lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_core", "lab", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
